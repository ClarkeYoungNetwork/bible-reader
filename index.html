<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Bible - KJV Reader</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --card-bg: #f8f9fa;
      --border: #e2e8f0;
      --accent: #1e293b;
      --verse-num: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 16px;
    }
    .header-bar {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 12px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-bottom: 2px solid var(--border);
      z-index: 10;
    }
    select, button {
      padding: 8px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }
    button.nav-btn { background: var(--accent); color: #ffffff; border: none; }
    button.nav-btn:hover { opacity: 0.9; }
    button.audio-btn { background: #16a34a; color: white; border: none; }
    button.audio-btn.stop { background: #dc2626; }
    .content-area {
      max-width: 820px;
      margin: 24px auto;
      padding: 0 10px;
    }
    h1 { font-size: 26px; margin-bottom: 18px; font-family: inherit; }
    .passage { font-size: 18px; text-align: justify; }
    p { margin-bottom: 14px; }
    .v-num {
      font-size: 0.75em;
      font-weight: 700;
      color: var(--verse-num);
      vertical-align: super;
      margin-right: 5px;
    }
    .loading { font-style: italic; color: var(--verse-num); }
  </style>
</head>
<body>

  <div class="header-bar">
    <select id="bookSelect"></select>
    <select id="chapterSelect"></select>
    <button class="nav-btn" onclick="prevChapter()">&larr; Prev</button>
    <button class="nav-btn" onclick="nextChapter()">Next &rarr;</button>
    <button class="audio-btn" onclick="playChapter()">🔊 Play</button>
    <button class="audio-btn stop" onclick="stopAudio()">⏹ Stop</button>
  </div>

  <div class="content-area">
    <h1 id="chapterTitle">Genesis 1</h1>
    <div id="scriptureContent" class="passage">
      <p class="loading">Loading Scripture...</p>
    </div>
  </div>

<script>
const books = [
  {id:1,n:"Genesis",c:50},{id:2,n:"Exodus",c:40},{id:3,n:"Leviticus",c:27},{id:4,n:"Numbers",c:36},
  {id:5,n:"Deuteronomy",c:34},{id:6,n:"Joshua",c:24},{id:7,n:"Judges",c:21},{id:8,n:"Ruth",c:4},
  {id:9,n:"1 Samuel",c:31},{id:10,n:"2 Samuel",c:24},{id:11,n:"1 Kings",c:22},{id:12,n:"2 Kings",c:25},
  {id:13,n:"1 Chronicles",c:29},{id:14,n:"2 Chronicles",c:36},{id:15,n:"Ezra",c:10},{id:16,n:"Nehemiah",c:13},
  {id:17,n:"Esther",c:10},{id:18,n:"Job",c:42},{id:19,n:"Psalms",c:150},{id:20,n:"Proverbs",c:31},
  {id:21,n:"Ecclesiastes",c:12},{id:22,n:"Song of Solomon",c:8},{id:23,n:"Isaiah",c:66},{id:24,n:"Jeremiah",c:52},
  {id:25,n:"Lamentations",c:5},{id:26,n:"Ezekiel",c:48},{id:27,n:"Daniel",c:12},{id:28,n:"Hosea",c:14},
  {id:29,n:"Joel",c:3},{id:30,n:"Amos",c:9},{id:31,n:"Obadiah",c:1},{id:32,n:"Jonah",c:4},
  {id:33,n:"Micah",c:7},{id:34,n:"Nahum",c:3},{id:35,n:"Habakkuk",c:3},{id:36,n:"Zephaniah",c:3},
  {id:37,n:"Haggai",c:2},{id:38,n:"Zechariah",c:14},{id:39,n:"Malachi",c:4},{id:40,n:"Matthew",c:28},
  {id:41,n:"Mark",c:16},{id:42,n:"Luke",c:24},{id:43,n:"John",c:21},{id:44,n:"Acts",c:28},
  {id:45,n:"Romans",c:16},{id:46,n:"1 Corinthians",c:16},{id:47,n:"2 Corinthians",c:13},{id:48,n:"Galatians",c:6},
  {id:49,n:"Ephesians",c:6},{id:50,n:"Philippians",c:4},{id:51,n:"Colossians",c:4},{id:52,n:"1 Thessalonians",c:5},
  {id:53,n:"2 Thessalonians",c:3},{id:54,n:"1 Timothy",c:6},{id:55,n:"2 Timothy",c:4},{id:56,n:"Titus",c:3},
  {id:57,n:"Philemon",c:1},{id:58,n:"Hebrews",c:13},{id:59,n:"James",c:5},{id:60,n:"1 Peter",c:5},
  {id:61,n:"2 Peter",c:3},{id:62,n:"1 John",c:5},{id:63,n:"2 John",c:1},{id:64,n:"3 John",c:1},
  {id:65,n:"Jude",c:1},{id:66,n:"Revelation",c:22}
];

const bookSel = document.getElementById('bookSelect');
const chSel = document.getElementById('chapterSelect');
const titleEl = document.getElementById('chapterTitle');
const contentEl = document.getElementById('scriptureContent');

books.forEach((b, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = b.n;
  bookSel.appendChild(opt);
});

function populateChapters() {
  chSel.innerHTML = '';
  const currentBook = books[bookSel.value];
  for (let i = 1; i <= currentBook.c; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Chapter ${i}`;
    chSel.appendChild(opt);
  }
}

bookSel.addEventListener('change', () => { populateChapters(); loadChapter(); });
chSel.addEventListener('change', loadChapter);

async function loadChapter() {
  stopAudio();
  const b = books[bookSel.value];
  const c = chSel.value;
  titleEl.textContent = `${b.n} ${c}`;
  contentEl.innerHTML = '<p class="loading">Loading Chapter...</p>';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    const res = await fetch(`https://bolls.life/get-chapter/KJV/${b.id}/${c}/`);
    if (!res.ok) throw new Error('Primary error');
    const data = await res.json();
    contentEl.innerHTML = data.map(v => {
      // Regex wipes out the scholarly numbers
      const cleanText = v.text.replace(/[0-9]+/g, '').trim();
      return `<p><span class="v-num">${v.verse}</span><span class="v-text">${cleanText}</span></p>`;
    }).join('');
  } catch (err) {
    try {
      const res2 = await fetch(`https://bible-api.com/${encodeURIComponent(b.n)}+${c}?translation=kjv`);
      const data2 = await res2.json();
      contentEl.innerHTML = data2.verses.map(v => {
        const cleanText = v.text.replace(/[0-9]+/g, '').trim();
        return `<p><span class="v-num">${v.verse}</span><span class="v-text">${cleanText}</span></p>`;
      }).join('');
    } catch (fallbackErr) {
      contentEl.innerHTML = '<p class="loading">Unable to fetch passage.</p>';
    }
  }
}

function nextChapter() {
  let curCh = parseInt(chSel.value, 10);
  if (curCh < books[bookSel.value].c) { chSel.value = curCh + 1; loadChapter(); }
  else if (bookSel.value < books.length - 1) { bookSel.value++; populateChapters(); chSel.value = 1; loadChapter(); }
}

function prevChapter() {
  let curCh = parseInt(chSel.value, 10);
  if (curCh > 1) { chSel.value = curCh - 1; loadChapter(); }
  else if (bookSel.value > 0) { bookSel.value--; populateChapters(); chSel.value = books[bookSel.value].c; loadChapter(); }
}

function playChapter() {
  stopAudio();
  const verses = document.querySelectorAll('.v-text');
  if (verses.length === 0) return;
  const fullText = Array.from(verses).map(v => v.textContent).join(' ');
  const utterance = new SpeechSynthesisUtterance(fullText);
  utterance.rate = 0.9; // Reads at a comfortable pace
  window.speechSynthesis.speak(utterance);
}

function stopAudio() {
  window.speechSynthesis.cancel();
}

populateChapters();
loadChapter();
</script>
</body>
</html>
